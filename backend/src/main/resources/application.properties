spring.application.name=backend

# PostgreSQL (override with environment variables; no password default on purpose)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kiwihire}
spring.datasource.username=${DB_USERNAME:kiwihire}
spring.datasource.password=${DB_PASSWORD}

# Schema is owned by Flyway migrations; Hibernate only validates it.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never

app.jwt.secret=${JWT_SECRET:kiwihire-local-development-secret-change-before-deployment}
app.jwt.expiration-ms=3600000

# Comma separated list of browser origins allowed to call the API directly.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Only the health endpoint is exposed by default. Set
# MANAGEMENT_ENDPOINTS=health,prometheus to let Prometheus scrape metrics, and
# only do that where the backend port is not reachable from the internet.
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS:health}
management.endpoint.health.probes.enabled=true

# API documentation (Swagger UI at /swagger-ui.html, JSON at /v3/api-docs).
# On by default for local work, off under the prod profile.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Latency histograms so Grafana can show percentiles.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
